<!-- templates/index.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Video Diversity Study</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .clusters-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }
        .video-item {
            position: relative;
            width: 100%;
            padding-top: 100%; /* 1:1 Aspect Ratio */
        }
        .video-item img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .metric-display {
            background-color: #f0f0f0;
            padding: 8px;
            border-radius: 4px;
            margin-top: 8px;
            text-align: center;
        }
        .cluster-name {
            font-size: 0.9em;
            color: #666;
            margin-top: 4px;
            overflow-wrap: break-word;
            word-wrap: break-word;
        }
    </style>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-7xl mx-auto">
        <h1 class="text-3xl font-bold mb-8">Intra-Cluster Variation Metrics</h1>
        
        <div class="bg-white p-6 rounded-lg shadow-lg mb-8">
            <p class="mb-4">Please rank these three sets of videos from most diverse (1) to least diverse (3) based on visual content.</p>
            <p class="mb-4">Each set contains 9 videos from the same category.</p>
        </div>

        <div id="loading" class="text-center py-8">
            Loading videos...
        </div>

        <div id="clusters-container" class="hidden">
            <div id="cluster-sections" class="clusters-grid"></div>
            
            <div class="bg-white p-6 rounded-lg shadow-lg">
                <h3 class="text-xl font-semibold mb-4">Your Ranking</h3>
                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="block mb-2">Most Diverse (1st):</label>
                        <select id="rank1" class="border p-2 w-full"></select>
                    </div>
                    <div>
                        <label class="block mb-2">Second (2nd):</label>
                        <select id="rank2" class="border p-2 w-full"></select>
                    </div>
                    <div>
                        <label class="block mb-2">Least Diverse (3rd):</label>
                        <select id="rank3" class="border p-2 w-full"></select>
                    </div>
                </div>
                
                <div class="mt-6 text-center">
                    <button id="submit" class="bg-blue-500 text-white px-6 py-2 rounded hover:bg-blue-600">
                        Submit Ranking
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let clusterData = {};
        let metricsData = {};

        function getClusterDisplayName(cluster) {
            // Extract the descriptive part after the numeric prefix
            const match = cluster.match(/\d+_(.*)/);
            return match ? match[1].replace(/_/g, ' ') : cluster;
        }

        async function loadVideos() {
            try {
                const response = await fetch('/get_videos');
                const data = await response.json();
                console.log("Received data:", data);
                clusterData = data.videos;
                metricsData = data.metrics;
                displayVideos();
                setupRankingDropdowns();
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('clusters-container').classList.remove('hidden');
            } catch (error) {
                console.error('Error loading videos:', error);
            }
        }

        function displayVideos() {
            const container = document.getElementById('cluster-sections');
            container.innerHTML = '';

            Object.entries(clusterData).forEach(([cluster, videos], index) => {
                const section = document.createElement('div');
                section.className = 'bg-white rounded-lg shadow-lg p-4';
                section.innerHTML = `
                    <h2 class="text-xl font-semibold mb-2">Video Set ${index + 1}</h2>
                    <div class="cluster-name mb-4">${getClusterDisplayName(cluster)}</div>
                    <div class="video-grid">
                        ${videos.map(video => `
                            <div class="video-item">
                                <img src="/video/${cluster}/${video}" alt="Video ${video}" />
                            </div>
                        `).join('')}
                    </div>
                    <div class="metric-display">
                        Diversity Metric: ${metricsData[cluster].toFixed(4)}
                    </div>
                `;
                container.appendChild(section);
            });
        }

        function setupRankingDropdowns() {
            const clusters = Object.keys(clusterData);
            const selects = ['rank1', 'rank2', 'rank3'];
            
            selects.forEach(selectId => {
                const select = document.getElementById(selectId);
                select.innerHTML = '<option value="">Select a video set...</option>' +
                    clusters.map((cluster, index) => 
                        `<option value="${cluster}">Video Set ${index + 1}: ${getClusterDisplayName(cluster)} (Metric: ${metricsData[cluster].toFixed(4)})</option>`
                    ).join('');
            });
        }

        document.getElementById('submit').addEventListener('click', async () => {
            const ranking = {
                rank1: document.getElementById('rank1').value,
                rank2: document.getElementById('rank2').value,
                rank3: document.getElementById('rank3').value,
                metrics: metricsData
            };

            if (!ranking.rank1 || !ranking.rank2 || !ranking.rank3) {
                alert('Please complete all rankings');
                return;
            }

            try {
                const response = await fetch('/submit_ranking', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(ranking)
                });
                
                if (response.ok) {
                    alert('Thank you for your participation!');
                    loadVideos();  // Load new videos for next ranking
                }
            } catch (error) {
                console.error('Error submitting ranking:', error);
                alert('Error submitting ranking. Please try again.');
            }
        });

        // Load initial videos
        loadVideos();
    </script>
</body>
</html>
